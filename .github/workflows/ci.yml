name: Free85 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run Free85 tests
        run: npm run validate:free85

      - name: Resolve the books' cross-references
        run: npm run check:companion:crossrefs

      - name: Build pinned sjasmplus
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/z00m128/sjasmplus/releases/download/v1.21.1/sjasmplus-1.21.1-src.tar.xz \
            --output "$RUNNER_TEMP/sjasmplus.tar.xz"
          echo "7c3e0bb473715777bec41f1b68caf9d4921da3f0cd9db66d922d3b804e0655c6  $RUNNER_TEMP/sjasmplus.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/sjasmplus"
          tar --extract --xz --file "$RUNNER_TEMP/sjasmplus.tar.xz" --directory "$RUNNER_TEMP/sjasmplus" --strip-components=1
          make --directory "$RUNNER_TEMP/sjasmplus" --jobs=2

      - name: Reproduce ROM and Pages artifacts
        env:
          SJASMPLUS: ${{ runner.temp }}/sjasmplus/sjasmplus
        run: npm run verify:free85:reproducible

      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: free85-visual-diffs
          path: test-results/free85-visual/
          if-no-files-found: ignore
          retention-days: 14
