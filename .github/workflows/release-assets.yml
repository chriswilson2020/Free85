name: Attach Free85 release assets

# Builds the ROM and the three typeset PDFs and attaches them to a release.
#
# This runs ONLY when you publish a release, or when you ask for it by hand.
# It never runs on a push to main and never runs on a pull request, so the
# assets change only when you decide a release should be made.
#
# It exists because release assets are the one publishing path in this
# project that nothing automated: dist/ is gitignored, so no PDF is tracked
# in the repository, and pages.yml publishes only the Pages artifact. The
# assets on Release_2.10 therefore went stale, and both the ROM and the
# companion PDF were months behind main before anybody noticed.
#
# Existing assets of the same name are replaced, so re-running this against
# a published release is the supported way to refresh a stale one.
#
# The PDFs are built on macOS and this is not a preference. typeset.css asks
# for Charter, Helvetica Neue and Menlo, which are macOS system fonts. On an
# Ubuntu runner none of the three exists, Chrome substitutes whatever it has,
# the metrics change and every book repaginates: the first Linux run of this
# workflow produced a 238-page companion where the proofed book is 248. The
# page-break work was done against the macOS rendering, so the macOS
# rendering is the book. The ROM has no such problem and stays on Ubuntu,
# where it is checked for byte reproducibility.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Resolved once so every later step and the summary agree on the target.
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  rom:
    name: Build and attach the ROM
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          # Build from the tag, not from main. A release cut from an older
          # commit must ship that commit's ROM and books.
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the validation suite
        # Nothing is published from a tree that does not pass. This is the
        # whole point of building the assets in CI rather than by hand.
        run: npm run validate:free85

      - name: Build pinned sjasmplus
        # Same pin and same checksum as ci.yml. Keep the two in step: the
        # reproducibility hash is computed from the ROM this produces.
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/z00m128/sjasmplus/releases/download/v1.21.1/sjasmplus-1.21.1-src.tar.xz \
            --output "$RUNNER_TEMP/sjasmplus.tar.xz"
          echo "7c3e0bb473715777bec41f1b68caf9d4921da3f0cd9db66d922d3b804e0655c6  $RUNNER_TEMP/sjasmplus.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/sjasmplus"
          tar --extract --xz --file "$RUNNER_TEMP/sjasmplus.tar.xz" --directory "$RUNNER_TEMP/sjasmplus" --strip-components=1
          make --directory "$RUNNER_TEMP/sjasmplus" --jobs=2

      - name: Build the ROM
        env:
          SJASMPLUS: ${{ runner.temp }}/sjasmplus/sjasmplus
        run: npm run build:free85

      - name: Verify the ROM is reproducible
        # Catches a tag whose committed reproducibility hash does not match
        # the ROM the sources actually assemble to.
        env:
          SJASMPLUS: ${{ runner.temp }}/sjasmplus/sjasmplus
        run: npm run verify:free85:reproducible

      - name: Attach the ROM to the release
        # --clobber replaces a same-named asset, so re-running this against a
        # published release refreshes a stale one rather than failing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ROM/FREE85.ROM --clobber

      - name: Summarise the ROM
        run: |
          {
            echo "### ROM attached to \`$RELEASE_TAG\`"
            echo
            printf '`FREE85.ROM` %s bytes, sha256 `%s`\n' \
              "$(stat -c%s ROM/FREE85.ROM)" "$(sha256sum ROM/FREE85.ROM | cut -c1-32)"
          } >> "$GITHUB_STEP_SUMMARY"

  books:
    name: Build and attach the typeset PDFs
    # macOS, because the design's fonts are macOS system fonts. See the note
    # at the top of this file: building these on Ubuntu silently repaginates
    # every book.
    runs-on: macos-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pandoc
        run: |
          brew install pandoc
          pandoc --version | head -1

      - name: Report which of the design's fonts are installed
        # Diagnostic only. The real guard is the page-count check after the
        # build: if the books paginate as proofed, the fonts resolved
        # correctly by definition. Asserting on font names instead was
        # tried and was worse, because macOS enumerates fonts through
        # system_profiler, which is slow and reports nothing useful from a
        # headless runner even when the font is installed and usable.
        continue-on-error: true
        run: |
          for dir in /System/Library/Fonts /System/Library/Fonts/Supplemental /Library/Fonts; do
            test -d "$dir" && ls "$dir" | grep -iE "charter|helveticaneue|menlo" | sed "s|^|  $dir/|" || true
          done

      - name: Locate Chrome
        run: |
          set -euo pipefail
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$chrome" || { echo "Google Chrome not found at $chrome" >&2; exit 1; }
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Build the typeset PDFs
        run: npm run build:guidebook:typeset

      - name: Check the books paginated as designed
        # This is the guard that matters, and the one that would have caught
        # the Ubuntu build. The page counts are those of the proofed
        # editions; a change means the rendering has moved and the books
        # need re-proofing, not publishing. The commonest cause is a missing
        # font, so the diagnostic step above lists what was available.
        run: |
          set -euo pipefail
          check() {
            actual=$(node -e "
              const b = require('fs').readFileSync('$2');
              console.log((b.toString('latin1').match(/\/Type\s*\/Page[^s]/g) || []).length);
            ")
            printf '%-12s %4s pages (expected %s)\n' "$1" "$actual" "$3"
            test "$actual" = "$3" || {
              echo "$1 paginated to $actual pages, expected $3" >&2
              exit 1
            }
          }
          check Manual    dist/guidebook/Free85-Manual-typeset.pdf     18
          check Guidebook dist/guidebook/Free85-Guidebook-typeset.pdf 158
          check Explorations dist/guidebook/Free85-Companion-typeset.pdf 248

      - name: Attach the books to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/guidebook/Free85-Manual-typeset.pdf \
            dist/guidebook/Free85-Guidebook-typeset.pdf \
            dist/guidebook/Free85-Companion-typeset.pdf \
            --clobber

      - name: Summarise the books
        run: |
          {
            echo "### Books attached to \`$RELEASE_TAG\`"
            echo
            echo "| Book | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            for f in dist/guidebook/Free85-Manual-typeset.pdf \
                     dist/guidebook/Free85-Guidebook-typeset.pdf \
                     dist/guidebook/Free85-Companion-typeset.pdf; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(stat -f%z "$f")" "$(shasum -a 256 "$f" | cut -c1-16)…"
            done
          } >> "$GITHUB_STEP_SUMMARY"
