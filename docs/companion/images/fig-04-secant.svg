<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" role="img"
     aria-label="A curve with three chords drawn from a fixed point, each to a nearer second point, pivoting closer to the tangent line at that point.">
  <!-- Free85 Explorations, chapter 4: chords closing on a tangent.
       Navy plus ink, no gradients, nothing depending on colour.
       Curve is y = x^2/40 + 30 mapped into the box; P is the fixed point. -->

  <!-- axes -->
  <g stroke="#111111" stroke-width="1" opacity="0.5">
    <line x1="24" y1="150" x2="240" y2="150"/>
    <line x1="40" y1="162" x2="40" y2="20"/>
  </g>

  <!-- the curve -->
  <path d="M 46 138 Q 96 152 132 120 T 226 28" fill="none" stroke="#111111"
        stroke-width="1.6"/>

  <!-- the tangent at P, drawn long and dashed: the thing being approached -->
  <line x1="88" y1="163" x2="214" y2="121" stroke="#1a3a6b" stroke-width="1.5"
        stroke-dasharray="5 3"/>

  <!-- three chords from P, each to a nearer point on the curve -->
  <g stroke="#1a3a6b" stroke-width="1.2" opacity="0.85">
    <line x1="118" y1="139" x2="216" y2="40"/>
    <line x1="118" y1="139" x2="186" y2="76"/>
    <line x1="118" y1="139" x2="152" y2="106"/>
  </g>

  <!-- the moving second points, largest first -->
  <circle cx="216" cy="40" r="2.6" fill="none" stroke="#1a3a6b" stroke-width="1.3"/>
  <circle cx="186" cy="76" r="2.6" fill="none" stroke="#1a3a6b" stroke-width="1.3"/>
  <circle cx="152" cy="106" r="2.6" fill="none" stroke="#1a3a6b" stroke-width="1.3"/>

  <!-- the fixed point -->
  <circle cx="118" cy="139" r="3.2" fill="#111111"/>

  <!-- arrow showing the second point sliding in -->
  <path d="M 210 52 A 70 70 0 0 1 160 100" fill="none" stroke="#444444"
        stroke-width="0.9" stroke-dasharray="2.5 2.5"/>
  <path d="M 164 96 L 158 102 L 166 104 Z" fill="#444444"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11"
     fill="#111111">
    <text x="106" y="153">P</text>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5"
     fill="#444444">
    <text x="176" y="132">chords</text>
    <text x="196" y="112" fill="#1a3a6b">tangent</text>
  </g>
</svg>
