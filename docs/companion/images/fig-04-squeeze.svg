<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" role="img"
     aria-label="A unit circle with a small angle x at the centre, showing the inner triangle, the sector and the outer triangle whose areas squeeze sine of x over x between cosine of x and one.">
  <!-- Free85 Explorations, chapter 4: the squeeze behind sin(x)/x.
       Palette is the book's navy plus ink; no gradients, no colour-dependent
       meaning, so the figure survives greyscale printing.
       Geometry: unit circle radius 110 at O(40,150), angle x = 34 degrees.
       A = (150,150)          on the circle, on the axis
       P = (131.2, 88.5)      on the circle at angle x
       T = (150, 76.2)        where OP produced meets the vertical at A -->

  <!-- the outer triangle O A T: area is tan(x)/2 -->
  <path d="M 40 150 L 150 150 L 150 76.2 Z" fill="#1a3a6b" fill-opacity="0.07"
        stroke="none"/>

  <!-- the circular sector O A P: area is x/2 -->
  <path d="M 40 150 L 150 150 A 110 110 0 0 0 131.2 88.5 Z"
        fill="#1a3a6b" fill-opacity="0.13" stroke="none"/>

  <!-- the inner triangle O A P: area is sin(x)/2 -->
  <path d="M 40 150 L 150 150 L 131.2 88.5 Z" fill="#1a3a6b" fill-opacity="0.22"
        stroke="none"/>

  <!-- the circle itself, drawn only where it is wanted -->
  <path d="M 150 150 A 110 110 0 0 0 61.5 42.2" fill="none" stroke="#111111"
        stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>

  <!-- axes -->
  <g stroke="#111111" stroke-width="1" opacity="0.55">
    <line x1="18" y1="150" x2="196" y2="150"/>
    <line x1="40" y1="172" x2="40" y2="34"/>
  </g>

  <!-- the vertical tangent at A -->
  <line x1="150" y1="150" x2="150" y2="60" stroke="#111111" stroke-width="0.9"
        stroke-dasharray="4 3" opacity="0.6"/>

  <!-- the three bounding figures, outlined -->
  <g fill="none" stroke="#1a3a6b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 40 150 L 150 76.2"/>
    <path d="M 40 150 L 131.2 88.5"/>
  </g>
  <line x1="131.2" y1="88.5" x2="150" y2="150" stroke="#1a3a6b" stroke-width="1.6"/>
  <line x1="150" y1="76.2" x2="150" y2="150" stroke="#1a3a6b" stroke-width="1.6"/>
  <line x1="40" y1="150" x2="150" y2="150" stroke="#1a3a6b" stroke-width="1.6"/>

  <!-- the angle arc at the centre -->
  <path d="M 76 150 A 36 36 0 0 0 69.9 129.9" fill="none" stroke="#111111"
        stroke-width="1.1"/>

  <!-- marked points -->
  <circle cx="40" cy="150" r="2.4" fill="#111111"/>
  <circle cx="150" cy="150" r="2.4" fill="#111111"/>
  <circle cx="131.2" cy="88.5" r="2.4" fill="#1a3a6b"/>
  <circle cx="150" cy="76.2" r="2.4" fill="#1a3a6b"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11"
     fill="#111111">
    <text x="31" y="164">O</text>
    <text x="147" y="164">A</text>
    <text x="82" y="143" font-style="italic">x</text>
    <text x="135" y="84" fill="#1a3a6b">P</text>
    <text x="155" y="74" fill="#1a3a6b">T</text>
    <text x="79" y="112" font-style="italic">1</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5"
     fill="#444444">
    <text x="206" y="86">OAT</text>
    <text x="206" y="99">tan x / 2</text>
    <text x="206" y="119">sector</text>
    <text x="206" y="132">x / 2</text>
    <text x="206" y="152">OAP</text>
    <text x="206" y="165">sin x / 2</text>
  </g>
  <g stroke="#444444" stroke-width="0.7" fill="none" opacity="0.8">
    <line x1="152" y1="82" x2="203" y2="82"/>
    <line x1="143" y1="115" x2="203" y2="115"/>
    <line x1="120" y1="140" x2="203" y2="148"/>
  </g>
</svg>
